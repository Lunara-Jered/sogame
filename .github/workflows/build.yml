name: Build SOGAME EQUIP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter doctor -v

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          configured_secrets=0
          for secret in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$secret" ]; then
              configured_secrets=$((configured_secrets + 1))
            fi
          done

          if [ "$configured_secrets" -eq 0 ]; then
            echo "No custom Android signing secrets configured; Gradle will use the debug keystore to sign the release APK."
            exit 0
          fi

          if [ "$configured_secrets" -ne 4 ]; then
            echo "::error::Configure all four Android signing secrets to use a production keystore, or remove all four to use debug signing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              return value.replace("\\", "\\\\").replace(":", "\\:").replace("=", "\\=").replace("\n", "\\n").replace("\r", "\\r")

          properties = {
              "storeFile": "app/upload-keystore.jks",
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in properties.items()),
              encoding="utf-8",
          )
          PY

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify release APK compatibility and signature
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not configured}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi

          apk="build/app/outputs/flutter-apk/app-release.apk"
          aapt="$(dirname "$apksigner")/aapt"
          badging="$("$aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -Fx "sdkVersion:'21'"
          printf '%s\n' "$badging" | grep -Eq "^targetSdkVersion:'[0-9]+'$"

          apk_entries="$(unzip -Z1 "$apk")"
          for abi in armeabi-v7a arm64-v8a; do
            if ! printf '%s\n' "$apk_entries" | grep -q "^lib/$abi/"; then
              echo "::error::Release APK does not contain native libraries for $abi."
              exit 1
            fi
          done

          "$apksigner" verify --verbose "$apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sogame-equip-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: |
          cd build/ios/iphoneos
          zip -r sogame-equip-ios-unsigned.zip Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sogame-equip-ios-unsigned
          path: build/ios/iphoneos/sogame-equip-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
