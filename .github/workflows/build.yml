name: Build SOGAME EQUIP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK (installable for testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      # Debug APKs are automatically signed with Android's debug key.
      # No GitHub signing secrets or custom keystore are required for testing.
      - name: Build installable Android APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Verify APK and signature
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path was not found."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          AAPT="$(dirname "$APKSIGNER")/aapt"
          echo "APK Android version requirements:"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" || true

          echo "Native architectures found:"
          unzip -Z1 "$APK" | grep -E '^lib/(armeabi-v7a|arm64-v8a)/' | sort -u || true

          echo "APK successfully built and signature verified."
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sogame-equip-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package iOS app
        run: |
          set -euo pipefail
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          ZIP_PATH="build/ios/iphoneos/sogame-equip-ios-unsigned.zip"
          test -d "$APP_PATH"
          mkdir -p "$(dirname "$ZIP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          test -s "$ZIP_PATH"
          unzip -Z1 "$ZIP_PATH" | grep -Fxq 'Runner.app/Runner'
          unzip -Z1 "$ZIP_PATH" | grep -Fxq 'Runner.app/Info.plist'
          echo "Unsigned iOS app archive created and verified: $ZIP_PATH"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: sogame-equip-ios-unsigned
          path: build/ios/iphoneos/sogame-equip-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
